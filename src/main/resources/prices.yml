# ─────────────────────────────
# 物品价格配置 (全部NBT匹配)
# ─────────────────────────────
# 格式: "物品名": [售出价, 收购价, "分类", 售出浮动率, 买入浮动率]
#   售出价 = 商店卖给玩家的价格 (-1 = 不出售)
#   收购价 = 商店收购的价格 (-1 = 不收)
#   售出浮动率 = 玩家每次购买，价格上升百分比 (指数复利)
#   买入浮动率 = 玩家每次出售，价格下降百分比 (指数复利)
#
# 物品键名同时作为 NBT 标识 (custom_data.shop_id = 键名)：
#   购买发放的物品为纯原版物品（无标签，可与常规物品堆叠）；
#   背包物品若带 NBT 标识则按 NBT 识别，无标签的原版物品退回按材质识别
#
# 惯例: 收购价 ≈ 售出价 × 0.8
# ─────────────────────────────

